<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .pulsing-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: dash 2s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -16; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bg-grad)"/>
  <rect width="1196" height="396" x="2" y="2" rx="18" fill="none" stroke="#312e81" stroke-width="2" opacity="0.6"/>

  <!-- Decorative Grid / Nodes in Background -->
  <g opacity="0.2" stroke="#818cf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4,4"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke-dasharray="4,4"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke-dasharray="4,4"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke-dasharray="4,4"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke-dasharray="4,4"/>
  </g>

  <!-- Dynamic Network Hierarchy Diagram (Right Side) -->
  <g transform="translate(880, 200)">
    <!-- Connections -->
    <path d="M0,-80 L-100,50" stroke="#a855f7" stroke-width="2.5" class="dash-flow" opacity="0.8"/>
    <path d="M0,-80 L100,50" stroke="#ec4899" stroke-width="2.5" class="dash-flow" opacity="0.8"/>
    <path d="M-100,50 L-150,130" stroke="#6366f1" stroke-width="2" class="dash-flow" opacity="0.7"/>
    <path d="M-100,50 L-50,130" stroke="#6366f1" stroke-width="2" class="dash-flow" opacity="0.7"/>
    <path d="M100,50 L50,130" stroke="#ec4899" stroke-width="2" class="dash-flow" opacity="0.7"/>
    <path d="M100,50 L150,130" stroke="#ec4899" stroke-width="2" class="dash-flow" opacity="0.7"/>

    <!-- Layer 1: Supervisor -->
    <circle cx="0" cy="-80" r="26" fill="#4f46e5" filter="url(#glow)" class="pulsing-circle"/>
    <text x="0" y="-74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">👑 TOP</text>

    <!-- Layer 2: Sub-Planners -->
    <circle cx="-100" cy="50" r="20" fill="#7c3aed" filter="url(#glow)"/>
    <text x="-100" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PLAN-A</text>
    <circle cx="100" cy="50" r="20" fill="#db2777" filter="url(#glow)"/>
    <text x="100" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PLAN-B</text>

    <!-- Layer 3: Atomic Reasoners -->
    <circle cx="-150" cy="130" r="14" fill="#2563eb"/>
    <circle cx="-50" cy="130" r="14" fill="#2563eb"/>
    <circle cx="50" cy="130" r="14" fill="#c026d3"/>
    <circle cx="150" cy="130" r="14" fill="#c026d3"/>
  </g>

  <!-- Typography & Main Branding -->
  <g transform="translate(80, 100)">
    <!-- Tagline Badge -->
    <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="140" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">⚡ MULTI-TIER AI ARCHITECTURES</text>

    <!-- Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Hierarchical Reasoning
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="url(#accent-grad)" letter-spacing="-1">
      Models (HRM) Tutorials 🧠
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">
      Master Autonomous Agent Planning, Multi-Tier Abstractions &amp; Neuro-Symbolic AI
    </text>

    <!-- Badges Row in Banner -->
    <g transform="translate(0, 225)">
      <rect width="120" height="28" rx="6" fill="#312e81"/>
      <text x="60" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">📚 21 Chapters</text>

      <rect x="130" width="130" height="28" rx="6" fill="#581c87"/>
      <text x="195" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f3e8ff" text-anchor="middle">🤖 LLM + Agents</text>

      <rect x="270" width="120" height="28" rx="6" fill="#831843"/>
      <text x="330" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fce7f3" text-anchor="middle">🚀 100% Practical</text>
    </g>
  </g>
</svg>